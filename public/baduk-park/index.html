<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214a38"><title>바둑공원 | Drawing Games</title>
<style>
:root{font-family:system-ui,sans-serif;color:#26372d;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}header{background:#214a38;color:white;padding:25px 18px}header .inner,nav .inner,main{max-width:900px;margin:auto}h1{margin:0;font-size:clamp(28px,5vw,38px)}header p{margin:8px 0 0;color:#d8e7db;font-size:14px}nav{background:#2d5b44}nav .inner{display:flex;gap:6px;padding:7px 14px}nav a{color:white;text-decoration:none;padding:9px 15px;border-radius:7px;font-weight:600}nav a:hover,nav a:focus-visible{background:#43785b}main{padding:22px 16px 40px}section{background:white;border:1px solid #dce5d9;border-radius:14px;padding:clamp(14px,3vw,25px)}h2{margin:0 0 8px}.description{color:#637468;margin:0 0 18px;font-size:14px}.board-shell{max-width:640px;margin:auto}.board{width:100%;aspect-ratio:1;background:#d9ab66;border:8px solid #a7783d;border-radius:9px;display:grid;grid-template-columns:repeat(19,minmax(0,1fr));grid-template-rows:repeat(19,minmax(0,1fr));padding:3.2%;box-shadow:0 5px 0 #8f642f}.point{position:relative;min-width:0;min-height:0;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}.point:before,.point:after{content:"";position:absolute;background:#77552d;pointer-events:none}.point:before{height:1px;top:50%;left:0;right:0}.point:after{width:1px;left:50%;top:0;bottom:0}.point.left:before{left:50%}.point.right:before{right:50%}.point.top:after{top:50%}.point.bottom:after{bottom:50%}.point.star:not(.occupied) .dot{position:absolute;width:19%;height:19%;background:#70502c;border-radius:50%;left:40.5%;top:40.5%;pointer-events:none}.stone{position:absolute;z-index:2;inset:2%;border-radius:50%;box-shadow:0 1px 3px #0007;pointer-events:none}.stone.black{background:radial-gradient(circle at 30% 25%,#555,#101010 70%)}.stone.white{background:radial-gradient(circle at 30% 25%,white,#d4d4d4 75%);border:1px solid #999}.point:focus-visible{outline:2px solid #2468e6;z-index:3}.controls{max-width:640px;margin:20px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.turn{font-weight:700}.reset{background:#214a38;color:white;border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}footer{text-align:center;color:#718076;font-size:12px;padding:22px}@media(max-width:480px){main{padding:13px 10px 28px}section{padding:13px}.board{border-width:5px}.stone{inset:0}}
</style></head><body>
<header id="home"><div class="inner"><h1>⚫ 바둑공원 ⚪</h1><p>2023년의 작은 프로젝트, 다시 시작합니다.</p></div></header>
<nav aria-label="메뉴"><div class="inner"><a href="#home">홈</a><a href="#board">바둑판</a></div></nav>
<main><section id="board"><h2>바둑판</h2><p class="description">흑과 백이 번갈아 돌을 놓는 19×19 연습판입니다. 집 계산과 돌 따내기는 아직 지원하지 않습니다.</p><div class="board-shell"><div class="board" id="goban" role="grid" aria-label="19×19 바둑판"></div></div><div class="controls"><span class="turn" id="turn" aria-live="polite">차례: 흑 ⚫</span><button type="button" class="reset" id="reset">판 초기화</button></div></section></main>
<footer>바둑공원 · Drawing Games · 2023 프로젝트의 2026년 재구성판</footer>
<script>
// 2026 reconstruction; not original 2023 source code.
const board=document.getElementById('goban'),turn=document.getElementById('turn'),placed=new Map();let black=true;
for(let y=0;y<19;y++)for(let x=0;x<19;x++){const point=document.createElement('button');point.type='button';point.className='point';if(x===0)point.classList.add('left');if(x===18)point.classList.add('right');if(y===0)point.classList.add('top');if(y===18)point.classList.add('bottom');if([3,9,15].includes(x)&&[3,9,15].includes(y))point.classList.add('star');point.setAttribute('role','gridcell');point.setAttribute('aria-label',`${x+1}열 ${y+1}행, 비어 있음`);const dot=document.createElement('span');dot.className='dot';point.appendChild(dot);point.addEventListener('click',()=>{const key=`${x},${y}`;if(placed.has(key))return;const stone=document.createElement('span');stone.className=`stone ${black?'black':'white'}`;point.appendChild(stone);point.classList.add('occupied');placed.set(key,{stone,point});point.setAttribute('aria-label',`${x+1}열 ${y+1}행, ${black?'흑':'백'}돌`);black=!black;turn.textContent=`차례: ${black?'흑 ⚫':'백 ⚪'}`});board.appendChild(point)}
document.getElementById('reset').addEventListener('click',()=>{for(const {stone,point} of placed.values()){stone.remove();point.classList.remove('occupied');point.setAttribute('aria-label',point.getAttribute('aria-label').replace(/, (흑|백)돌$/,', 비어 있음'))}placed.clear();black=true;turn.textContent='차례: 흑 ⚫'});
</script></body></html>
